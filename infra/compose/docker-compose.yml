services:
  db:
    image: mariadb:12
    container_name: oauth-mariadb
    ports:
      - "3306:3306"
    volumes:
      - ../../data/mariadb:/var/lib/mysql
    environment:
      - MARIADB_ROOT_PASSWORD=admin123!
      - MARIADB_DATABASE=oauth_db
      - MARIADB_USER=oauth-app
      - MARIADB_PASSWORD=oauth-app
    networks:
      - oauth-network
  nodejs:
    image: node:26
    container_name: oauth-nodejs
    user: "1000:1000"
    ports:
      - "3000:3000"
    working_dir: /app
    tty: true
    stdin_open: true
    volumes:
      - ../../client:/app
    networks:
      - oauth-network
    #command: sleep infinity
    command: >
      sh -c "npm run dev -- --host --port 3000"
networks:
  oauth-network:
    driver: bridge
